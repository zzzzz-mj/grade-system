server:
  port: 8080

spring:
  datasource:
    # 请确认本地 MySQL 已创建数据库 grade_system（见 README）
    url: jdbc:mysql://localhost:3306/grade_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 启动时自动建表并写入种子数据（幂等：IF NOT EXISTS + INSERT IGNORE）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: utf-8

mybatis:
  map-underscore-to-camel-case: true
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.gradesystem.mapper: debug
